name = "relay-ice"
main = "src/index.js"
compatibility_date = "2026-09-08"

# KEEP the workers.dev address alive alongside the custom domain. Adding
# [[routes]] silently disables it by default, and shipped apps point at it -
# turning it off strands every already-deployed build until it is redeployed.
# It costs nothing to serve both, and it is a second way in if the custom
# domain is ever the blocked one.
workers_dev = true

# A CUSTOM DOMAIN rather than the workers.dev address, and the reason is the
# whole point of this Worker: *.workers.dev is routinely blocked by corporate
# and school firewalls - exactly the restrictive networks a relay exists to
# rescue. A blocked credential endpoint means no relay for precisely the people
# who need one.
#
# Cloudflare creates and manages the DNS record for this (proxied, like
# explorers.starsystemx.com). The zone's CAA already permits pki.goog, which is
# the CA a Worker custom domain uses - do not narrow that list.
[[routes]]
pattern = "turn.starsystemx.com"
custom_domain = true

# Counts only: which app asked, and what happened. No IPs, no per-visitor rows.
# Query it with the Workers Analytics Engine SQL API, or from the dashboard.
# ENABLE Analytics Engine on the account first (one click, Workers ->
# Analytics Engine in the dashboard), then uncomment and redeploy. The Worker
# already tolerates the binding being absent, so it runs either way.
# [[analytics_engine_datasets]]
# binding = "RELAY_ANALYTICS"
# dataset = "relay_ice"

# Without this the endpoint is a free TURN relay for whoever finds it.
# 30 requests per minute per address is far above any honest use: a browser
# asks once per page load and then caches the answer for two hours.
[[ratelimits]]
name = "RELAY_LIMIT"
# Unique per ACCOUNT, not per Worker: if another Worker on this account already
# uses 1001, pick a different number here.
namespace_id = "1001"

  [ratelimits.simple]
  limit = 30
  period = 60

# Secrets — set with `wrangler secret put`, NEVER written here:
#   TURN_KEY_ID
#   TURN_KEY_API_TOKEN
